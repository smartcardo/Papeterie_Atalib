<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papeterie Atalib</title>
<meta name="description" content="Papeterie Atalib — fournitures scolaires, papeterie et librairie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,800;1,9..144,900&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4A6FA8; --blue-deep:#2F4C7E; --ink:#151515; --paper:#FFFFFF; --mist:#EEF2F8; --line:#DCE3EE; --muted:#5C6678;
  --on-ink:#FFFFFF; --wa:#1FA855;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0F1218; --mist:#171C26; --line:#262E3D; --ink:#F2F4F8; --muted:#9AA5B8; --on-ink:#0F1218; --blue:#6F93CC;}
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.page{max-width:460px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:84px}
@media(min-width:560px){.page{margin:20px auto;border-radius:28px;overflow:hidden;min-height:auto;box-shadow:0 18px 50px rgba(47,76,126,.18)}}

.logo{background:#fff;padding:18px 28px 0;border-bottom:4px solid var(--blue)}
.logo img{display:block;width:100%;max-width:360px;height:auto;margin:0 auto}
.head{padding:26px 24px 6px}
h1{font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:40px;line-height:1;letter-spacing:-.01em;margin:0}
h1 span{color:var(--blue)}
.lead{margin:10px 0 0;color:var(--muted);font-size:16px;max-width:34ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.tags li{font-size:13.5px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--mist);color:var(--ink)}

.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px 24px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:12px 14px;border-radius:14px;font:700 16px 'Hanken Grotesk',sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer;color:#fff;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.row:focus-visible,.dock a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.call{background:#151515;color:#fff}
.btn.wa{background:var(--wa)}
.btn.map{background:var(--blue-deep)}
.btn.mail{background:var(--blue)}
.btn.ig{background:linear-gradient(45deg,#F9CE34,#EE2A7B 45%,#6228D7)}
.btn.fb{background:#1877F2}
.mapbox{width:100%;height:280px;border:0;border-radius:16px;margin-top:14px;display:block;background:var(--mist)}
.btn.save{grid-column:1/-1;background:transparent;color:var(--ink);border-color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.call{background:#F2F4F8;color:#0F1218}}

.group{padding:26px 24px 0}
.group h2{font-family:'Fraunces',serif;font-style:italic;font-weight:800;font-size:22px;margin:0 0 6px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:16px}
.row:last-child{border-bottom:0}
.ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center}
.row small{display:block;color:var(--muted);font-weight:500;font-size:13.5px}
.row .t{min-width:0;overflow-wrap:anywhere}

.foot{padding:30px 24px 10px;color:var(--muted);font-size:13.5px}
.dock{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;color:var(--on-ink);text-decoration:none;font-weight:700;font-size:12.5px}
.dock a+a{border-left:1px solid rgba(128,128,128,.35)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--blue-deep);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;z-index:9}
@media(prefers-reduced-motion:no-preference){.logo img{animation:in .6s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
function fold(l){const o=[];while(l.length>74){o.push(l.slice(0,74));l=' '+l.slice(74)}o.push(l);return o.join('\r\n')}
function buildVcf(){
  const esc=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const L=['BEGIN:VCARD','VERSION:3.0','N:;'+esc(CONFIG.name)+';;;','FN:'+esc(CONFIG.name),'ORG:'+esc(CONFIG.name),'TITLE:'+esc(CONFIG.role),
    'TEL;TYPE=CELL,VOICE:'+CONFIG.phone,'EMAIL;TYPE=INTERNET,WORK:'+CONFIG.email,'ADR;TYPE=WORK:;;'+esc(CONFIG.address)+';;;;',
    'item1.URL:'+CONFIG.mapsUrl,'item1.X-ABLabel:Localisation','item2.URL:'+CONFIG.instagramUrl,'item2.X-ABLabel:Instagram',
    'item3.URL:'+CONFIG.facebookUrl,'item3.X-ABLabel:Facebook','item4.URL:https://wa.me/'+CONFIG.whatsapp,'item4.X-ABLabel:WhatsApp',
    'NOTE:'+esc(CONFIG.tagline)];
  if(CONFIG.photo) L.push('PHOTO;ENCODING=b;TYPE=JPEG:'+CONFIG.photo);
  L.push('END:VCARD'); return L.map(fold).join('\r\n')+'\r\n';
}
async function saveContact(){
  const vcf=buildVcf();
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){location.href='data:text/vcard;charset=utf-8,'+encodeURIComponent(vcf);return}
  const file=new File([vcf],'Papeterie-Atalib.vcf',{type:'text/vcard'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:CONFIG.name});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([vcf],{type:'text/vcard;charset=utf-8'}));a.download='Papeterie-Atalib.vcf';
  document.body.appendChild(a);a.click();a.remove();
  toast('Ouvrez le fichier téléchargé, puis appuyez sur « Enregistrer » dans Contacts');
}

    <a class="row" href="tel:${CONFIG.phone}"><span class="ico">${I.phone}</span><span class="t">${CONFIG.phoneDisplay}</span></a>
    <a class="row" href="mailto:${CONFIG.email}"><span class="ico">${I.mail}</span><span class="t">${CONFIG.email}</span></a>
    <iframe class="mapbox" title="Carte" src="https://www.google.com/maps?q=${encodeURIComponent(CONFIG.address)}&z=15&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>
  <section class="group">
    <h2>Suivez-nous</h2>
    <a class="row" href="${CONFIG.instagramUrl}" target="_blank" rel="noopener"><span class="ico">${I.ig}</span><span class="t">Instagram</span></a>
    <a class="row" href="${CONFIG.facebookUrl}" target="_blank" rel="noopener"><span class="ico">${I.fb}</span><span class="t">Facebook</span></a>
  </section>
  <div class="foot">${CONFIG.name} — ${CONFIG.role}</div>
  <nav class="dock" aria-label="Actions rapides">
    <a href="tel:${CONFIG.phone}">${I.phone}Appeler</a>
    <a href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">${I.wa}WhatsApp</a>
    <a href="${CONFIG.mapsUrl}" target="_blank" rel="noopener">${I.pin}Localisation</a>
  </nav>`;
</script>
</body>
